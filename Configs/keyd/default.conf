# keyd: teclado estilo macOS sobre Openbox
# Aplicar:  sudo cp ~/.config/keyd/default.conf /etc/keyd/ && sudo keyd reload
#
# Teclas físicas (teclado PC)          ->  equivalente Mac
#   Alt izquierdo (junto al espacio)   ->  Cmd
#   Super / Windows                    ->  Option
#   Ctrl                               ->  Ctrl
#   Alt derecho                        ->  sin cambios (Compose)
#
# Cmd actúa como Ctrl por defecto (Cmd+C/V/X/Z/A/S/T/W/F/N/L/R... -> Ctrl+...).
# Los atajos de sistema se reenvían como combinaciones que escucha Openbox (rc.xml).
# Códigos internos para Openbox (no se pulsan a mano):
#   Ctrl+Alt+Super+←/→/↑     escritorio anterior/siguiente, lista de ventanas
#   Ctrl+Alt+Super+Shift+←/→ mover ventana al escritorio anterior/siguiente
# Así Ctrl+←/→ y Ctrl+Shift+←/→ quedan libres para saltar palabras (Option+flechas).

[ids]
*

[main]
leftalt = layer(meta_mac)

# ============================================================ Cmd
[meta_mac:C]
# --- Sistema (Openbox) ---
space = A-space
enter = A-enter
q = A-q
m = A-m
h = A-h
left = A-left
right = A-right
up = A-up
down = A-down
sysrq = A-sysrq
tab = swapm(app_switch_state, A-tab)
f1 = A-f1
f2 = A-f2
f3 = A-f3
f4 = A-f4
f5 = A-f5
f6 = A-f6
f7 = A-f7
f8 = A-f8
f9 = A-f9
f10 = A-f10
f11 = A-f11
f12 = A-f12
# --- Texto: Cmd+Borrar = borrar hasta el inicio de la línea ---
backspace = macro(S-home backspace)
# --- Navegador: Cmd+1..9 = pestaña N (en Linux es Alt+N) ---
1 = A-1
2 = A-2
3 = A-3
4 = A-4
5 = A-5
6 = A-6
7 = A-7
8 = A-8
9 = A-9

# Selector de ventanas: Alt se mantiene pulsado mientras Cmd siga pulsado
[app_switch_state:A]
tab = A-tab

# ============================================================ Option
[meta]
# Saltar / borrar palabras
left = C-left
right = C-right
up = C-up
down = C-down
backspace = C-backspace
delete = C-delete

# ============================================================ Ctrl
[control]
# Escritorios (Spaces) y lista de ventanas (Mission Control)
left = C-A-M-left
right = C-A-M-right
up = C-A-M-up

[shift]

# ============================================================ Combinaciones
# Cmd+Shift
[meta_mac+shift]
3 = A-S-3
4 = A-S-4
5 = A-S-5
q = A-S-q
space = A-S-space
tab = swapm(app_switch_state, A-S-tab)
left = S-home
right = S-end
up = C-S-home
down = C-S-end

[app_switch_state+shift]
tab = A-S-tab

# Ctrl+Cmd
[control+meta_mac]
q = C-A-q
f = C-A-f
space = C-A-space
t = C-A-t
v = C-A-v
r = C-A-r
h = C-A-h
l = C-A-l
m = C-A-m
delete = C-A-delete
left = C-A-left
right = C-A-right
up = C-A-up
down = C-A-down

# Cmd+Option
[meta+meta_mac]
esc = M-A-esc
space = M-A-space
m = M-A-m
r = M-A-r
left = M-A-left
right = M-A-right
up = M-A-up
down = M-A-down

# Option+Shift: seleccionar palabras / párrafos
[meta+shift]
left = C-S-left
right = C-S-right
up = C-S-up
down = C-S-down

# Ctrl+Option: colocar ventanas (estilo Rectangle), sin traducir
[control+meta]
left = C-M-left
right = C-M-right
up = C-M-up
down = C-M-down
backspace = C-M-backspace
delete = C-M-delete

# Ctrl+Shift+←/→: mover ventana al escritorio anterior/siguiente
[control+shift]
left = C-A-M-S-left
right = C-A-M-S-right
