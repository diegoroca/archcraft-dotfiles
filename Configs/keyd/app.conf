# keyd-application-mapper: excepciones por aplicación (clase de ventana normalizada en minúsculas)
# Recargar tras editar:  pkill -USR1 -f keyd-application-mapper
#
# Terminales: Ctrl+C interrumpe el programa, así que Cmd usa los atajos de terminal.

[alacritty]
meta_mac.c = C-S-c
meta_mac.v = C-S-v
meta_mac.f = C-S-f
meta_mac.k = C-l
meta_mac.w = A-f4
meta_mac.n = A-enter
meta_mac.t = A-enter
meta_mac.z = noop
meta_mac.backspace = C-u
meta.left = A-b
meta.right = A-f
meta.backspace = C-w
meta.delete = A-d

[alacritty-fullscreen]
meta_mac.c = C-S-c
meta_mac.v = C-S-v
meta_mac.f = C-S-f
meta_mac.k = C-l
meta_mac.w = A-f4
meta_mac.n = A-enter
meta_mac.t = A-enter
meta_mac.z = noop
meta_mac.backspace = C-u
meta.left = A-b
meta.right = A-f
meta.backspace = C-w
meta.delete = A-d

[xfce4-terminal]
